<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Passwort zurücksetzen</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --primary-light: #e0e7ff;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --bg-body: #f8fafc;
            --border-color: #e2e8f0;
            --border-focus: #6366f1;
            --error-bg: #fef2f2;
            --error-text: #991b1b;
            --error-border: #fecaca;
            --success-bg: #f0fdf4;
            --success-text: #166534;
            --success-border: #bbf7d0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: var(--bg-body);
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.08) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(79, 70, 229, 0.08) 0px, transparent 50%);
            padding: 24px;
        }

        .card {
            width: 100%;
            max-width: 440px;
            background: #ffffff;
            border-radius: 24px;
            padding: 40px 32px;
            box-shadow: 
                0 4px 6px -1px rgba(0, 0, 0, 0.02),
                0 20px 25px -5px rgba(0, 0, 0, 0.05),
                0 0 0 1px rgba(0, 0, 0, 0.03);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .brand-icon {
            width: 48px;
            height: 48px;
            background: var(--primary-light);
            color: var(--primary);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px auto;
        }

        .brand-icon svg {
            width: 24px;
            height: 24px;
        }

        h1 {
            text-align: center;
            font-size: 24px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: -0.02em;
            margin-bottom: 8px;
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 32px;
            font-size: 14px;
            line-height: 1.5;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            font-size: 13px;
            color: var(--text-main);
            text-transform: uppercase;
            letter-spacing: 0.04em;
        }

        .input-wrapper {
            position: relative;
            display: flex;
            align-items: center;
        }

        .input-icon {
            position: absolute;
            left: 14px;
            color: #94a3b8;
            pointer-events: none;
            display: flex;
            align-items: center;
        }

        .input-icon svg {
            width: 18px;
            height: 18px;
        }

        input {
            width: 100%;
            padding: 12px 42px 12px 42px;
            border: 1.5px solid var(--border-color);
            border-radius: 12px;
            font-size: 15px;
            color: var(--text-main);
            background: #f8fafc;
            outline: none;
            transition: all 0.2s ease;
        }

        input::placeholder {
            color: #94a3b8;
        }

        input:focus {
            background: #ffffff;
            border-color: var(--border-focus);
            box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.12);
        }

        .toggle-password {
            position: absolute;
            right: 12px;
            background: none;
            border: none;
            padding: 4px;
            color: #94a3b8;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            transition: color 0.2s ease;
            width: auto;
        }

        .toggle-password:hover {
            color: var(--text-main);
            background: transparent;
            opacity: 1;
        }

        .toggle-password svg {
            width: 18px;
            height: 18px;
        }

        button[type="submit"] {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 12px;
            background: var(--primary);
            color: white;
            font-size: 15px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 12px rgba(79, 70, 229, 0.25);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            margin-top: 24px;
        }

        button[type="submit"]:hover {
            background: var(--primary-hover);
            box-shadow: 0 6px 16px rgba(79, 70, 229, 0.35);
            transform: translateY(-1px);
        }

        button[type="submit"]:active {
            transform: translateY(0);
        }

        button[type="submit"]:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .message {
            margin-top: 20px;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.5;
            display: none;
            align-items: center;
            gap: 10px;
            animation: fadeIn 0.3s ease;
        }

        .message.show {
            display: flex;
        }

        .message.success {
            background: var(--success-bg);
            color: var(--success-text);
            border: 1px solid var(--success-border);
        }

        .message.error {
            background: var(--error-bg);
            color: var(--error-text);
            border: 1px solid var(--error-border);
        }

        .message svg {
            width: 18px;
            height: 18px;
            flex-shrink: 0;
        }

        .spinner {
            width: 18px;
            height: 18px;
            border: 2px solid rgba(255, 255, 255, 0.3);
            border-radius: 50%;
            border-top-color: white;
            animation: spin 0.8s linear infinite;
            display: none;
        }

        .lang-switch { display: flex; justify-content: flex-end; gap: 4px; margin: -16px -8px 12px 0; }
        .lang-switch button {
            width: auto; padding: 4px 10px; border: 1px solid var(--border-color); border-radius: 8px;
            background: #fff; color: var(--text-muted); font-size: 12px; font-weight: 600; cursor: pointer;
        }
        .lang-switch button[aria-pressed="true"] { background: var(--primary-light); color: var(--primary); border-color: var(--primary); }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-4px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

<div class="card">
    <div class="lang-switch" role="group" aria-label="Language">
        <button type="button" data-set-lang="de" aria-pressed="true">DE</button>
        <button type="button" data-set-lang="en" aria-pressed="false">EN</button>
    </div>
    <div class="brand-icon">
        <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" d="M16.5 10.5V6.75a4.5 4.5 0 10-9 0v3.75m-.75 11.25h10.5a2.25 2.25 0 002.25-2.25v-6.75a2.25 2.25 0 00-2.25-2.25H6.75a2.25 2.25 0 00-2.25 2.25v6.75a2.25 2.25 0 002.25 2.25z" />
        </svg>
    </div>

    <h1 data-i18n="title">Passwort zurücksetzen</h1>

    <p class="subtitle" data-i18n="subtitle">
        Geben Sie unten Ihr neues Passwort ein, um Ihr Konto zu schützen.
    </p>

    <form id="form">
        <div class="input-group">
            <label for="password" data-i18n="newPw">Neues Passwort</label>
            <div class="input-wrapper">
                <span class="input-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 5.25a3 3 0 013 3m3 0a6 6 0 01-7.029 5.912c-.563-.097-1.159.026-1.563.43L10.5 17.25H8.25v2.25H6v2.25H2.25v-2.818c0-.597.237-1.17.659-1.591l6.499-6.499c.404-.404.527-1 .43-1.563A6 6 0 1121.75 8.25z" />
                    </svg>
                </span>
                <input
                    id="password"
                    type="password"
                    minlength="8"
                    required
                    data-i18n-ph="phMin" placeholder="Mindestens 8 Zeichen"
                >
                <button type="button" class="toggle-password" onclick="toggleVisibility('password', this)" data-i18n-aria="toggle" aria-label="Passwort anzeigen/verbergen">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                </button>
            </div>
        </div>

        <div class="input-group">
            <label for="confirm" data-i18n="confirmPw">Passwort bestätigen</label>
            <div class="input-wrapper">
                <span class="input-icon">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75m-3-7.036A11.959 11.959 0 013.598 6 11.99 11.99 0 003 9.749c0 5.592 3.824 10.29 9 11.623 5.176-1.332 9-6.03 9-11.622 0-1.31-.21-2.571-.598-3.751A11.959 11.959 0 0112 2.714z" />
                    </svg>
                </span>
                <input
                    id="confirm"
                    type="password"
                    minlength="8"
                    required
                    data-i18n-ph="phConfirm" placeholder="Passwort erneut eingeben"
                >
                <button type="button" class="toggle-password" onclick="toggleVisibility('confirm', this)" data-i18n-aria="toggle" aria-label="Passwort anzeigen/verbergen">
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" />
                        <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                    </svg>
                </button>
            </div>
        </div>

        <button id="submitBtn" type="submit">
            <span class="spinner" id="spinner"></span>
            <span id="btnText">Passwort aktualisieren</span>
        </button>
    </form>

    <div id="message" class="message"></div>
</div>

<script>
// EliteDent production Supabase project (same as backend/.env)
const SUPABASE_URL = "https://rlsshhqohjfszuiweteh.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJsc3NoaHFvaGpmc3p1aXdldGVoIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc1NzUyNTEsImV4cCI6MjEwMzE1MTI1MX0.ju7EsEYmtltzvXlmAV_1OulflNOyhfANDuRt53yuPL0";

const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
);

// Language: ?lang= (set by the app from the user's login-screen choice), else last
// choice on this browser, else German (the app's default).
const I18N = {
    de: {
        pageTitle: "Passwort zurücksetzen",
        title: "Passwort zurücksetzen",
        subtitle: "Geben Sie unten Ihr neues Passwort ein, um Ihr Konto zu schützen.",
        newPw: "Neues Passwort", confirmPw: "Passwort bestätigen",
        phMin: "Mindestens 8 Zeichen", phConfirm: "Passwort erneut eingeben",
        toggle: "Passwort anzeigen/verbergen",
        update: "Passwort aktualisieren", updating: "Wird aktualisiert…", updated: "Passwort aktualisiert",
        invalidLink: "Dieser Link zum Zurücksetzen des Passworts ist ungültig oder abgelaufen.",
        tooShort: "Das Passwort muss mindestens 8 Zeichen lang sein.",
        mismatch: "Die Passwörter stimmen nicht überein.",
        success: "Passwort erfolgreich aktualisiert. Sie können zur App zurückkehren und sich anmelden.",
    },
    en: {
        pageTitle: "Reset Password",
        title: "Reset Password",
        subtitle: "Enter your new password below to secure your account.",
        newPw: "New Password", confirmPw: "Confirm Password",
        phMin: "Minimum 8 characters", phConfirm: "Re-enter password",
        toggle: "Toggle password visibility",
        update: "Update Password", updating: "Updating...", updated: "Password Updated",
        invalidLink: "This password reset link is invalid or has expired.",
        tooShort: "Password must be at least 8 characters long.",
        mismatch: "Passwords do not match.",
        success: "Password updated successfully. You can now return to the app and sign in.",
    },
};
const LANG_KEY = "elitedent-lang";
let lang = (function () {
    const q = new URLSearchParams(window.location.search).get("lang");
    if (q === "de" || q === "en") return q;
    try { const v = localStorage.getItem(LANG_KEY); if (v === "de" || v === "en") return v; } catch (e) {}
    return "de";
})();
const t = (k) => I18N[lang][k];
let state = "idle"; // idle | loading | done
let lastMsg = null; // { key, type } so a language switch re-renders the message

function applyLang(next) {
    lang = next;
    try { localStorage.setItem(LANG_KEY, next); } catch (e) {}
    document.documentElement.lang = next;
    document.title = t("pageTitle");
    document.querySelectorAll("[data-i18n]").forEach((el) => { el.textContent = t(el.dataset.i18n); });
    document.querySelectorAll("[data-i18n-ph]").forEach((el) => { el.placeholder = t(el.dataset.i18nPh); });
    document.querySelectorAll("[data-i18n-aria]").forEach((el) => { el.setAttribute("aria-label", t(el.dataset.i18nAria)); });
    document.querySelectorAll("[data-set-lang]").forEach((b) => {
        b.setAttribute("aria-pressed", b.dataset.setLang === next ? "true" : "false");
    });
    btnText.textContent = state === "loading" ? t("updating") : state === "done" ? t("updated") : t("update");
    if (lastMsg) showKey(lastMsg.key, lastMsg.type);
}

const form = document.getElementById("form");
const msg = document.getElementById("message");
const btn = document.getElementById("submitBtn");
const btnText = document.getElementById("btnText");
const spinner = document.getElementById("spinner");

document.querySelectorAll("[data-set-lang]").forEach((b) => {
    b.addEventListener("click", () => applyLang(b.dataset.setLang));
});

function showKey(key, type) {
    lastMsg = { key, type };
    showMessage(t(key), type);
}

function toggleVisibility(inputId, button) {
    const input = document.getElementById(inputId);
    const isPassword = input.type === "password";
    input.type = isPassword ? "text" : "password";
    
    button.innerHTML = isPassword 
        ? `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" /></svg>`
        : `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="1.8" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M2.036 12.322a1.012 1.012 0 010-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178z" /><path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" /></svg>`;
}

function showMessage(text, type) {
    msg.className = "message " + type + " show";
    
    const icon = type === "success" 
        ? `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12.75L11.25 15 15 9.75M21 12a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>`
        : `<svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m9-.75a9 9 0 11-18 0 9 9 0 0118 0zm-9 3.75h.008v.008H12v-.008z" /></svg>`;

    msg.innerHTML = icon + `<span>${text}</span>`;
}

function setLoading(isLoading) {
    btn.disabled = isLoading;
    state = isLoading ? "loading" : "idle";
    spinner.style.display = isLoading ? "block" : "none";
    btnText.textContent = isLoading ? t("updating") : t("update");
}

async function initializeRecovery() {
    const hash = window.location.hash.substring(1);

    if (hash) {
        const params = new URLSearchParams(hash);
        const access_token = params.get("access_token");
        const refresh_token = params.get("refresh_token");

        if (access_token && refresh_token) {
            const { error } = await supabaseClient.auth.setSession({
                access_token,
                refresh_token
            });

            if (error) {
                showMessage(error.message, "error");
                btn.disabled = true;
            }
            return;
        }
    }

    const { data } = await supabaseClient.auth.getSession();

    if (!data.session) {
        showKey("invalidLink", "error");
        btn.disabled = true;
    }
}

initializeRecovery();
applyLang(lang);

form.addEventListener("submit", async (e) => {
    e.preventDefault();
    msg.classList.remove("show");
    lastMsg = null;

    const password = document.getElementById("password").value.trim();
    const confirm = document.getElementById("confirm").value.trim();

    if (password.length < 8) {
        showKey("tooShort", "error");
        return;
    }

    if (password !== confirm) {
        showKey("mismatch", "error");
        return;
    }

    setLoading(true);

    const { error } = await supabaseClient.auth.updateUser({
        password: password
    });

    setLoading(false);

    if (error) {
        showMessage(error.message, "error");
        return;
    }

    showKey("success", "success");
    btn.disabled = true;
    state = "done";
    btnText.textContent = t("updated");
});
</script>

</body>
</html>
